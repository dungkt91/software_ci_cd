name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/index.js

      - name: Build Docker image
        run: docker build -t software-ci-cd:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          docker run -d --name app -p 3000:3000 software-ci-cd:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      # Publish only from main, never from pull requests.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag software-ci-cd:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag software-ci-cd:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # Enable once real tests exist. The current "test" script always fails.
      # - name: Run tests
      #   run: npm test
