name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/index.js

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Single-platform (amd64) build loaded locally for the smoke test.
      # Buildx cannot --load a multi-platform build.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: software-ci-cd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        run: |
          docker run -d --name app -p 3000:3000 software-ci-cd:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fs http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      # Publish only from main, never from pull requests.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: full commit SHA, plus latest on the default branch.
      # metadata-action lowercases the image name automatically.
      - name: Docker metadata
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Multi-arch push. The amd64 layers come from the cache of the smoke-test build.
      - name: Push multi-arch Docker image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Enable once real tests exist. The current "test" script always fails.
      # - name: Run tests
      #   run: npm test
