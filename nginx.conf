events {}

http {
  # Pool of backends. Docker DNS resolves "app" to every replica IP.
  upstream backend {
    server app:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Shows which replica served the request (useful to see load balancing).
      add_header X-Upstream $upstream_addr always;
    }
  }
}
